boundary: The platform profile selects hardware custody (Secure Enclave on signed macOS, a non-exportable
  CNG key on Windows with TPM or software provider) or owner-only software keys only for unsigned dev
  builds; Mila's files are owner-only through POSIX modes or a protected user-and-SYSTEM DACL on Windows.
denial: A release build that carries the software-keys define refuses to start; a Windows file whose DACL
  is inherited, unprotected or grants any other SID is refused rather than read; a POSIX file other users
  can read is refused.
evidence:
- assertion: LiveSession
  execution: present
  kind: unit
  path: mila/native/linux/src/session.rs
  scope: The production Windows interop invokes the Rust list/revoke ABI through owned buffers,
    rejects missing sessions and malformed request ids, and exercises the bounded controller projection;
    no live Windows host or Porsche journey is claimed.
- assertion: LiveSession
  execution: present
  kind: unit
  path: mila/native/linux/src/session.rs
  scope: The Windows shell copies only bounded machine-list bytes from an authenticated Rust handle,
    decodes typed rows for selection/detail and refuses a missing handle; no live Windows journey is claimed.
- assertion: LiveSession
  execution: present
  kind: unit
  path: mila/native/linux/src/session.rs
  scope: Start/stop/delete and bounded resize dispatches use canonical Porsche request ids and an
    authenticated Rust handle; missing handles refuse without mutation, and no live Windows backend is claimed.
- assertion: LiveSession
  execution: present
  kind: unit
  path: mila/native/linux/src/session.rs
  scope: Web endpoint inspection is bound to the selected machine and authenticated Rust handle;
    missing handles refuse before any endpoint reaches WinUI, with no embedded WebView claim.
- assertion: LiveSession
  execution: present
  kind: unit
  path: mila/native/linux/src/session.rs
  scope: The typed Windows reducer refuses stale approval outcomes, rejects non-HTTPS approval URLs,
