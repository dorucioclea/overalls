boundary: Dedicated unprivileged userspace tailnet node per host with its own state and socket; Underclass
  cgroup limited to loopback behind a privileged exit-node start gate; host tailscaled, routes and other
  services unchanged.
denial: Underclass refuses to start before the egress node is logged in with the exit node selected; its
  unit cannot reach any non-loopback address directly; a lost exit node fails requests rather than falling
  back to the host's own address.
