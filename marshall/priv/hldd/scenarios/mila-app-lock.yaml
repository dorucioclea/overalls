boundary: Locked content is offstage and excluded from semantics; the lock fails closed when its setting
  is saved, and an unlock result from an older attempt is ignored.
denial: A failed or stale authentication leaves Mila locked; a platform without biometrics reports the
  lock unavailable instead of pretending to lock.
