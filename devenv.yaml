inputs:
  nix-compact:
    url: github:ghuntley/nix-compact/9e43798f4ebf1b969432b6e1eb9f8a0bdf69fede
  git-hooks:
    url: github:cachix/git-hooks.nix
    inputs:
      nixpkgs:
        follows: nixpkgs
  nixpkgs:
    url: github:cachix/devenv-nixpkgs/rolling
  # Upstream Rust release toolchains with iOS standard libraries for the
  # Darwin Mila Apple build (devenv.nix languages.rust).
  rust-overlay:
    url: github:oxalica/rust-overlay
    inputs:
      nixpkgs:
        follows: nixpkgs
