boundary: Mila fetches https://HOST/bin/ssh-trust.json without redirects, pins it, and in key exchange
  accepts only an Ed25519 host certificate from the pinned CA naming the management host inside its validity
  window, before user authentication.
denial: Another CA, another principal, an expired certificate or a plain host key ends the connection
  before the device key signs; a conflicting later trust document is refused and the pin kept; an unreachable
  origin uses only an unretired pin.
