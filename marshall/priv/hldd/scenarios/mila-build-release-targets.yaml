boundary: mila-build builds every Apple target from typed inputs; release targets require their signing
  inputs, refuse a profile for another team or application identifier, never fall back to ad-hoc signing
  and verify signatures (and macOS notarization) as the final step.
denial: An Apple release with a missing team, identity, profile, version or notary profile, a malformed
  version, another team's profile or a non-macOS host is refused instead of substituted.
evidence:
- assertion: require MILA_APPLE_TEAM MILA_APPLE_IDENTITY MILA_APPLE_PROFILE_RUNNER MILA_VERSION
  execution: recorded
  kind: manual
  path: mila/native/apple/build.sh
  record: docs/architecture/reviews/2026-10-29-mila-apple-host-app.md
  record_assertion: '`mila-build macos release` and `mila-build ios release` with no inputs exited 1
    naming `MILA_APPLE_TEAM`'
  scope: Release input refusals on aarch64-darwin without signing material.
- assertion: MilaNativeApp.main()
  execution: recorded
  kind: manual
  path: mila/native/apple/App/Sources/Mila/main.swift
  record: docs/architecture/reviews/2026-10-29-mila-apple-host-app.md
  record_assertion: '`mila-run ios` installed and launched the app on an iPhone 17 Pro simulator'
  scope: macOS and iOS-simulator dev builds through devenv on aarch64-darwin with Xcode 26.2.
- assertion: test_english_usage_text_is_required
  execution: present
  kind: unit
  path: mila/localization/test_apple_infoplist_strings.py
  scope: Localized Face ID usage text generated from the shared catalogs; empty text and a missing
    English entry are refused.
gaps: No Apple release has run with signing material, so profile matching, notarization, stapling and
  spctl are unexercised. Ad-hoc dev builds cannot sign in. Linux, Android and Windows targets have no
  scenario evidence since the Dart planner was removed, and the Windows release job still calls it.
id: mila-build-release-targets
journey: A maintainer builds a dev or release Mila for Linux, Android, iOS, macOS or Windows
layers:
- identity
- execution
preferred_gap: Run the Apple release workflow in the protected environment and record its signature,
  notarization and spctl output; add a property test over build.sh inputs. NixOS machine tests cannot
  sign Apple or Windows artifacts.
scope: Apple dev builds and launches on a Mac and Apple release input refusals; signed release paths and
  non-Apple targets are not executed here.
status: partial
