[project]
name = "overalls-antithesis-fixtures"
version = "0.1.0"
requires-python = "==3.13.*"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ANN", "SIM", "RUF"]
ignore = ["E501"]

[tool.ty.environment]
python-version = "3.13"
# Antithesis runs this code in Linux containers; match CI on any host.
python-platform = "linux"

[tool.ty.src]
include = ["**/*.py"]
