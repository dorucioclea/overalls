gaps: The artifact-origin (2026-10-21) and artifact-agent-publish (2026-10-28) machine runs are recorded in the
  review; artifact-agent-publish's stale-base subtest failed intermittently with provider_failed before the
  2026-10-21 merge. Administrator deletion is covered only by BEAM tests because unattended fixtures cannot hold
  elevation. No test restores a backup with artifacts or drives the storage bridge's role checks from a hostile
  page in a real browser. The content host is same-site with Marshall until a separate registrable domain exists.
  Production has not enabled the content host.
id: artifacts-publish-share
journey: An agent publishes an artifact, revises it with read-before-write, the owner shares it with a viewer
  who renders it on the isolated content origin, and revoking the share stops the viewer's next fetch
layers:
- identity
- authorization
- transport
- execution
- isolation
- storage
- recovery
preferred_gap: Add a restore drill that checks ticket expiry and purge resumption from a backup, and a hostile-page
  browser test of the storage bridge's role checks.
scope: Hegel properties for edits, manifests, limits, tool parsing and Markdown escaping, a PostgreSQL-backed
  versioning model and single-winner concurrent publishes; PostgreSQL-backed units for the role matrix,
  server-tool publish and refusal, content endpoint tickets and headers, LiveView sharing and storage, and Ziggy's
  chunk bound; authorization-freshness, publish-request and Oban-idempotency properties; the recorded artifact-origin
  machine run and its Hegel escape property; and the recorded artifact-agent-publish run.
