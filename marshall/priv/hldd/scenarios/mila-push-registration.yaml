boundary: Mila exchanges the platform token for a relay push key at the fixed relay origin and registers
  through Porsche with the push key on stdin; the deployment binds the device to the registering SSH key.
  Mila persists only a token digest, device id, key id and expiry.
denial: A relay refusal, a push_disabled deployment or a denied system permission leaves notifications
  off with a reason; a stale or reordered reply never changes state; turning notifications off during
  an in-flight registration removes the device once it lands.
