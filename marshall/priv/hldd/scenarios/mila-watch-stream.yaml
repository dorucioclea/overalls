boundary: porsche.watch_subscribe authorizes every named machine and thread for the session; Porsche registers
  only the returned identifiers, coalesces hints and repeats the subscription each heartbeat; notices
  carry identifiers only.
denial: A stranger's thread refuses the whole subscription (403); a pending key without --session gets
  approval instructions; a revoked key ends the stream with exit 3 at the next heartbeat.
