boundary: The agent artifact tool acts with the prompting user's fresh Cedar roles under a locked server-tool
  claim; publishes lock the artifact row and name their base version; content is served only on the isolated
  content origin through a five-minute view ticket rechecked against Cedar on every fetch, behind HAProxy
  credential stripping and the lockdown header set.
denial: A stale base version is refused with the current version and no new version; a missing or ambiguous
  edit, an over-limit page, publish or version, a traversal path or an unknown argument is refused before
  persistence; another user's or an unshared artifact answers not_found; a viewer cannot publish, share,
  delete or write shared storage; expired, revoked, foreign-host, wrong-version and other users' tickets receive
  the same locked-down 404; non-GET/HEAD content requests receive 405 and unknown hosts 421; an artifact page
  cannot read Marshall cookies, reach the network, submit forms or be framed by a foreign origin.
