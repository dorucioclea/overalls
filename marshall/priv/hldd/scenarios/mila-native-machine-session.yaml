id: mila-native-machine-session
journey: A native client refreshes and pages its machine list over the Rust SSH session
boundary: The Rust session validates machine identities and permissions from a certificate-pinned SSH channel; Marshall remains authorization authority.
denial: Nonzero exit, malformed envelope, invalid authority fields, incomplete channel exit, cursor cycles and listing bounds preserve the previous successful projection and return an error.
status: partial
scope: Local real TCP SSH with scripted server replies and pure Hegel decoder properties; native application adapters are not exercised.
layers:
- transport
- authorization
- recovery
evidence:
- assertion: LiveSession
  execution: present
  kind: unit
  path: mila/native/linux/src/session.rs
  scope: Real local certificate-pinned SSH verifies one authentication, page ordering, snapshot completeness and deployment binding; remote command results are scripted.
- assertion: LiveSession
  execution: present
  kind: unit
  path: mila/native/linux/src/session.rs
  scope: Malformed response, nonzero exit and missing exit status return errors and retain prior validated rows.
- assertion: arbitrary_stale_terminal_handles_refuse_without_writing
  execution: present
  kind: property
  path: mila/rust/mila-ffi/tests/session.rs
  scope: Generated permission, owner and pin combinations preserve the wire projection and action policy; identity and authority corruption is refused.
gaps: Native UI and signer wiring, browser approval, real Porsche authorization, watch refresh and persistence custody remain unverified.
preferred_gap: Add a NixOS native-client and real Porsche machine journey; scripted SSH replies do not establish server authorization.
