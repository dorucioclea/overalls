boundary: Pokes are encrypted to a per-deployment device X25519 key with the host in the AAD; only the
  device opens them, and the notification shows fixed localized text with the validated route as its tap
  link.
denial: Any flipped byte, truncation, extension, wrong host, unknown version or plaintext outside {v:1,
  kind:needs_input, route} is refused before anything is shown.
