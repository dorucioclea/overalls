name: "mila builds"

# Mila's dev targets on every platform (ADR-0235). Linux and Android build in
# Nix; macOS and iOS use the devenv shell with the runner's Xcode; Windows has
# no Nix and builds from the mila-source-bundle the Linux job produces, so it
# sees the same patched dartssh2, fonts, Monocypher and locked pub packages.
on:
  pull_request:
    paths:
      - "mila/**"
      - "mila/rust/**"
      - "protocol/test/fixtures/**"
      - "nix/domains/artifacts/mila/**"
      - "nix/platform/dartssh2.nix"
      - "nix/platform/patches/dartssh2-*"
      - ".github/workflows/mila-builds.yml"
  push:
    branches: [trunk]
    paths:
      - "mila/**"
      - "mila/rust/**"
      - "protocol/test/fixtures/**"
      - "nix/domains/artifacts/mila/**"
      - "nix/platform/dartssh2.nix"
      - "nix/platform/patches/dartssh2-*"
      - ".github/workflows/mila-builds.yml"
  workflow_dispatch:

concurrency:
  group: mila-builds-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The pinned Flutter (ADR-0227) for hosts without Nix, from
  # storage.googleapis.com/flutter_infra_release/releases/releases_windows.json.
  FLUTTER_VERSION: 3.47.0
  FLUTTER_WINDOWS_SHA256: 9f96d393cdfad05bea0b4b42c603ffda027af11adadc8e4cf3ac87e49110c1ca

jobs:
  linux:
    runs-on: namespace-profile-cached-amd64-xl;container.privileged=true
    timeout-minutes: 120
    steps:
      - uses: namespacelabs/nscloud-checkout-action@v9
      - uses: ./.github/actions/devenv
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          install-devenv: "false"
      - name: Mila checks and Linux dev/release targets
        run: |
          cachix watch-exec overalls -- nix build -L --no-link \
            .#checks.x86_64-linux.mila-core \
            .#checks.x86_64-linux.mila-transport \
            .#checks.x86_64-linux.mila-tool \
            .#checks.x86_64-linux.mila-test \
            .#checks.x86_64-linux.mila-lock-sync \
            .#checks.x86_64-linux.mila-rust \
            .#tool-mila-linux-dev \
            .#tool-mila-linux-release \
            .#tool-mila-rust

  source-bundle:
    runs-on: namespace-profile-cached-amd64-xl;container.privileged=true
    timeout-minutes: 60
    steps:
      - uses: namespacelabs/nscloud-checkout-action@v9
      - uses: ./.github/actions/devenv
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          install-devenv: "false"
      - name: Validate shared localization catalogs
        run: |
          python3 -m unittest mila/localization/test_generate_catalogs.py
          python3 mila/localization/generate_catalogs.py \
            --source marshall/priv/gettext \
            --output "$RUNNER_TEMP/mila-localization"
          python3 mila/localization/generate_catalogs.py \
            --source mila/app/lib/l10n \
            --output "$RUNNER_TEMP/mila-localization-app"
      - name: Build the source bundle
        run: |
          nix build -L .#tool-mila-source-bundle --out-link bundle
          mkdir -p out
          cp -L bundle/* out/
          (cd out && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: mila-source-bundle
          path: out/
          if-no-files-found: error
          retention-days: 7

  android:
    runs-on: namespace-profile-cached-amd64-xl;container.privileged=true
    timeout-minutes: 90
    steps:
      - uses: namespacelabs/nscloud-checkout-action@v9
      - uses: ./.github/actions/devenv
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          install-devenv: "false"
      - name: Android dev APK (debug key)
        run: cachix watch-exec overalls -- nix build -L --no-link .#tool-mila-android

  apple:
    # Mila's macOS and iOS dev targets and the shared native poke tests.
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Setup Nix
        uses: cachix/install-nix-action@9aaadd8b85853f67fcdf488e6a4e9efa94ee96e2
      - name: Setup Cachix
        uses: cachix/cachix-action@ee79db531bfb851a7cf47035057b7cca88d26449
        with:
          name: overalls
          extraPullNames: devenv
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          useDaemon: false
      - name: Install devenv
        run: |
          rev=$(jq -r '.nodes.devenv.locked.rev' devenv.lock)
          nix profile install "github:cachix/devenv/$rev"
          devenv version
      - name: Format, analyze and test Mila
        run: devenv shell -- mila-check
      - name: Build Rust FFI for Apple native tests
        run: devenv shell -- cargo build --manifest-path mila/rust/Cargo.toml -p mila-ffi --release
      - name: Swift native package tests
        working-directory: mila/native/apple
        env:
          MILA_FFI_LIB_DIR: ${{ github.workspace }}/mila/rust/target/release
        run: |
          swift build
          swift test
      - name: macOS and iOS dev targets
        run: |
          devenv shell -- mila-build macos dev
          devenv shell -- mila-build ios dev
      - name: Native RunnerTests (macOS and iOS simulator)
        # Apple's toolchain, not Nix's: the same environment mila-build uses.
        run: |
          devenv shell -- bash -euo pipefail -c '
            unset SDKROOT CC CXX LD
            export DEVELOPER_DIR="$(xcode-select -p)" PATH="/usr/bin:$PATH"
            cd mila/app/macos
            xcodebuild test -workspace Runner.xcworkspace -scheme Runner \
              -destination platform=macOS CODE_SIGNING_ALLOWED=NO MILA_SIGNING=unsigned
            cd ../ios
            device=$(xcrun simctl list devices available -j |
              jq -r "[.devices[][] | select(.name | startswith(\"iPhone\"))][0].udid")
            xcodebuild test -workspace Runner.xcworkspace -scheme Runner \
              -destination "id=$device" CODE_SIGNING_ALLOWED=NO
          '

  apple-native:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Build Rust FFI for Apple native tests
        run: cargo build --manifest-path mila/rust/Cargo.toml -p mila-ffi --release
      - name: Swift native package tests
        working-directory: mila/native/apple
        env:
          MILA_FFI_LIB_DIR: ${{ github.workspace }}/mila/rust/target/release
        run: swift test

  windows:
    needs: source-bundle
    runs-on: windows-2025
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mila-source-bundle
          path: ${{ runner.temp }}/bundle
      - name: Unpack and verify the source bundle
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/bundle"
          sha256sum -c SHA256SUMS
          # Git Bash cannot pass the Windows runner's `D:\\...` path to tar's
          # `-C` option. Extract beside the archive and resolve the root there.
          tar -xzf mila-source-bundle-*.tar.gz
          root=$(find . -maxdepth 1 -type d -name 'mila-source-bundle-*' -print -quit)
          root=$(cd "$root" && pwd -W)
          (cd "$root" && sha256sum --quiet -c SHA256SUMS)
          echo "MILA_ROOT=$root" >> "$GITHUB_ENV"
          echo "PUB_CACHE=$root/pub-cache" >> "$GITHUB_ENV"
      - name: Install the pinned Flutter
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "flutter.zip"
          $url = "https://storage.googleapis.com/flutter_infra_release/releases/stable/windows/flutter_windows_$($env:FLUTTER_VERSION)-stable.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($hash -ne $env:FLUTTER_WINDOWS_SHA256) { throw "Flutter archive digest $hash does not match the pin" }
          tar -xf $zip -C $env:RUNNER_TEMP
          Remove-Item $zip
          "$env:RUNNER_TEMP\flutter\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Resolve packages offline from the bundle
        run: |
          flutter config --no-analytics
          flutter --version
          foreach ($d in "packages/mila_core", "packages/mila_transport", "tool", "app") {
            Push-Location (Join-Path $env:MILA_ROOT "mila/$d")
            flutter pub get --offline --enforce-lockfile
            if ($LASTEXITCODE -ne 0) { throw "pub get failed in $d" }
            Pop-Location
          }
      - name: Transport tests (Windows owner-only DACLs)
        working-directory: ${{ env.MILA_ROOT }}/mila/packages/mila_transport
        run: |
          dart test --reporter expanded
          if ($LASTEXITCODE -ne 0) { throw "mila_transport tests failed" }
      - name: mila-build tests
        working-directory: ${{ env.MILA_ROOT }}/mila/tool
        run: |
          dart test --reporter expanded
          if ($LASTEXITCODE -ne 0) { throw "mila/tool tests failed" }
      - name: Native poke opener (CTest)
        working-directory: ${{ env.MILA_ROOT }}
        run: |
          cmake -S mila/app/native -B build/native "-DMILA_MONOCYPHER_DIR=$env:MILA_ROOT/third_party/monocypher"
          if ($LASTEXITCODE -ne 0) { throw "cmake configure failed" }
          cmake --build build/native --config Release
          if ($LASTEXITCODE -ne 0) { throw "native build failed" }
          ctest --test-dir build/native -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw "CTest failed" }
      - name: Windows dev target
        working-directory: ${{ env.MILA_ROOT }}/mila/tool
        run: |
          dart run bin/mila_build.dart windows dev
          if ($LASTEXITCODE -ne 0) { throw "mila-build windows dev failed" }
      - name: Build Rust Windows FFI
        working-directory: ${{ env.MILA_ROOT }}
        run: |
          cargo build --manifest-path mila/rust/Cargo.toml -p mila-ffi --release
          if ($LASTEXITCODE -ne 0) { throw "Rust FFI build failed" }
      - name: Native WinUI build (.NET 10)
        working-directory: ${{ env.MILA_ROOT }}/mila/windows-dotnet
        run: |
          dotnet restore
          dotnet --version
          if (-not (dotnet --version).StartsWith("10.")) { throw "Mila requires the latest .NET 10 SDK" }
          $ffi = Join-Path $env:MILA_ROOT "mila/rust/target/release/mila_ffi.dll"
          if (-not (Test-Path $ffi)) { throw "Rust FFI DLL was not built: $ffi" }
          dotnet build --configuration Release --no-restore -p:MilaNativeDll=$ffi
          $staged = Join-Path $env:MILA_ROOT "mila/windows-dotnet/bin/Release/net10.0-windows10.0.19041.0/win-x64/mila_native.dll"
          if (-not (Test-Path $staged)) { throw "Native DLL was not staged beside WinUI executable" }
      - uses: actions/upload-artifact@v4
        with:
          name: mila-windows-dev
          path: ${{ env.MILA_ROOT }}/mila/build/windows-dev/
          if-no-files-found: error
          retention-days: 7

  windows-native:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Build Rust Windows FFI
        run: cargo build --manifest-path mila/rust/Cargo.toml -p mila-ffi --release
      - name: Build native WinUI client (.NET 10)
        working-directory: mila/windows-dotnet
        shell: pwsh
        run: |
          dotnet restore
          $version = dotnet --version
          if (-not $version.StartsWith("10.")) { throw "Mila requires the latest .NET 10 SDK, found $version" }
          $ffi = Join-Path $env:GITHUB_WORKSPACE "mila/rust/target/release/mila_ffi.dll"
          if (-not (Test-Path $ffi)) { throw "Rust FFI DLL was not built: $ffi" }
          dotnet build --configuration Release --no-restore -p:MilaNativeDll=$ffi

      - name: Invoke staged Rust DLL through production .NET interop
        shell: pwsh
        run: |
          $staged = Join-Path $env:GITHUB_WORKSPACE "mila/windows-dotnet/bin/Release/net10.0-windows10.0.19041.0/win-x64/mila_native.dll"
          if (-not (Test-Path $staged)) { throw "WinUI build did not stage the Rust DLL: $staged" }
          dotnet run --project mila/windows-dotnet-smoke --configuration Release -p:MilaNativeDll=$staged
          if ($LASTEXITCODE -ne 0) { throw "Rust/.NET FFI smoke failed" }

  linux-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install GTK4 and libadwaita development libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-4-dev libadwaita-1-dev pkg-config
      - name: Build and test native GTK client
        working-directory: mila/native/linux
        run: |
          cargo build --locked --release
          test -x target/release/mila-linux
          cargo test --locked
      - name: Check formatting
        working-directory: mila/native/linux
        run: cargo fmt --all -- --check

  android-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM for the Android emulator
        timeout-minutes: 5
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm -a -w /dev/kvm
      - uses: android-actions/setup-android@v3
        timeout-minutes: 10
        with:
          # Preinstall the emulator and image so reactivecircus does not
          # fetch the moving "latest" archive during the test step.
          packages: >-
            platform-tools
            emulator
            platforms;android-35
            system-images;android-35;google_apis;x86_64
      - name: Install Android SDK platform
        timeout-minutes: 10
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        timeout-minutes: 5
        with:
          gradle-version: '9.3.1'
      - name: Install Rust Android linker
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Install cargo-ndk
        timeout-minutes: 10
        run: cargo install cargo-ndk --locked
      - name: Assemble native Compose APK
        timeout-minutes: 20
        working-directory: mila/native/android
        run: |
          gradle --no-daemon --stacktrace assembleDebug assembleDebugAndroidTest testDebugUnitTest
          test -f app/build/outputs/apk/debug/app-debug.apk
      - name: Invoke packaged Rust JNI on Android
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 2048M
          force-avd-creation: true
          emulator-boot-timeout: 900
          disable-linux-hw-accel: auto
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          working-directory: mila/native/android
          disable-animations: true
          script: gradle --no-daemon connectedDebugAndroidTest

  native-gate:
    name: Native platform gate
    if: ${{ always() }}
    needs: [apple-native, android-native, linux-native, windows-native]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify parity matrix records remaining native gaps
        run: |
          python3 - <<'PY'
          from pathlib import Path

          matrix = Path("mila/native/PARITY_MATRIX.md").read_text(encoding="utf-8")
          rows = [line for line in matrix.splitlines() if line.startswith("|") and "---" not in line]
          if not any("partial" in row for row in rows):
              raise SystemExit("parity matrix must retain partial evidence until end-to-end parity is proven")
          if not any("open" in row for row in rows):
              raise SystemExit("parity matrix must retain open gaps until every native feature is implemented")

          workflow = Path(".github/workflows/mila-builds.yml").read_text(encoding="utf-8")
          if "FLUTTER_VERSION:" not in workflow:
              raise SystemExit("Flutter CI cannot be removed while parity gaps remain")
          print("Parity matrix honestly records incomplete native workflows; Flutter remains until closure.")
          PY
      - name: Require every native platform job to pass
        env:
          APPLE: ${{ needs.apple-native.result }}
          ANDROID: ${{ needs.android-native.result }}
          LINUX: ${{ needs.linux-native.result }}
          WINDOWS: ${{ needs.windows-native.result }}
        run: |
          set -eu
          for result in "$APPLE" "$ANDROID" "$LINUX" "$WINDOWS"; do
            test "$result" = success || {
              echo "Native platform gate failed: $result" >&2
              exit 1
            }
          done
