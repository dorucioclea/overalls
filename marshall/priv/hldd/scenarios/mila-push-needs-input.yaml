boundary: After the planning transaction commits, Marshall queues one delivery per active, enabled device
  of current thread writers other than the actor, seals the route to the device X25519 key and sends Susan
  only a signed ciphertext body; 503s retry under the same delivery id and 410 invalidates the device.
denial: Viewers, the actor, paused, revoked and invalidated devices receive nothing; a rolled-back question
  produces nothing; a stranger key cannot open the poke; the operator switch refuses registration with
  push_disabled.
