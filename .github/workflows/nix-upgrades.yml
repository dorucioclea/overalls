name: "automatic nix upgrades"

on:
  schedule:
    # Run every Monday at 5:00 AM UTC
    - cron: "0 5 * * 1"
  workflow_dispatch:

concurrency:
  group: nix-upgrades
  cancel-in-progress: true

permissions:
  contents: write

env:
  TARGET_BRANCH: ${{ github.event.repository.default_branch }}

jobs:
  nix-upgrades:
    runs-on: namespace-profile-cached-amd64

    steps:
      - name: Checkout repository
        uses: namespacelabs/nscloud-checkout-action@v9
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Nix cache
        run: |
          sudo mkdir -p /cache/nix /nix
          sudo mount --bind /cache/nix /nix
          sudo chown runner /nix

      - name: Setup Nix
        uses: cachix/install-nix-action@9aaadd8b85853f67fcdf488e6a4e9efa94ee96e2

      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: devenv

      - name: Install devenv.sh
        run: nix profile install nixpkgs#devenv

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update, commit and push
        id: update
        run: |
          set -euo pipefail

          # Runs `devenv update`, pins flake.lock's buildNixpkgs to the same
          # devenv-nixpkgs revision (flake-package-inputs; enforced by the
          # package-input-lock check) and commits both locks. Returns non-zero
          # when neither lock file changed.
          update_and_commit() {
            devenv update

            node=$(jq -r '.nodes.root.inputs.nixpkgs' devenv.lock)
            pin=$(jq -r --arg node "$node" '.nodes[$node].locked | "github:\(.owner)/\(.repo)/\(.rev)"' devenv.lock)
            nix flake lock --override-input buildNixpkgs "$pin"

            if [ -z "$(git status --porcelain -- devenv.lock flake.lock)" ]; then
              return 1
            fi

            echo "Changes detected in the lock files:"
            git --no-pager diff -- devenv.lock flake.lock || true

            summary=$(git diff -- devenv.lock | grep -E '^\+.*"(devenv|git-hooks|nixpkgs)".*github:' | sed 's/^+/- Updated: /' || true)
            [ -n "$summary" ] || summary="- Updated devenv dependencies"

            git add devenv.lock flake.lock
            git commit -F - <<EOF
          chore(deps): update devenv dependencies

          Automated update of development environment dependencies:
          $summary
          - Pinned flake.lock buildNixpkgs to $pin

          🤖 Generated automatically by the automatic nix upgrades workflow
          EOF
          }

          if ! update_and_commit; then
            echo "changes=false" >> "$GITHUB_OUTPUT"
            echo "No devenv updates available"
            exit 0
          fi
          echo "changes=true" >> "$GITHUB_OUTPUT"

          # Push directly to the default branch. If the branch moved while we
          # were updating, rebase onto the latest tip and retry. A lock file
          # conflict is resolved by discarding our commit and regenerating the
          # lock from the new tip rather than attempting a textual merge.
          for attempt in 1 2 3 4 5; do
            git fetch origin "$TARGET_BRANCH"

            if ! git rebase "origin/$TARGET_BRANCH"; then
              echo "Rebase conflicted; regenerating the locks on top of origin/$TARGET_BRANCH"
              git rebase --abort
              git reset --hard "origin/$TARGET_BRANCH"
              if ! update_and_commit; then
                echo "Upstream already contains these updates; nothing to push"
                exit 0
              fi
            fi

            if git push origin "HEAD:$TARGET_BRANCH"; then
              echo "Pushed to $TARGET_BRANCH on attempt $attempt"
              exit 0
            fi

            echo "Push rejected (attempt $attempt); retrying"
            sleep $((attempt * 5))
          done

          echo "Failed to push after 5 attempts" >&2
          exit 1

      - name: Summary
        run: |
          if [ "${{ steps.update.outputs.changes }}" = "true" ]; then
            echo "✅ DevEnv updates found and pushed to ${TARGET_BRANCH}"
          else
            echo "✅ DevEnv is up to date"
            echo "📅 No updates needed at this time"
          fi
