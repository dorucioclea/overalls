id: inception-development-checkout
journey: Create an Inception workload with a durable Overalls development checkout
layers:
  - identity
  - authorization
  - transport
  - isolation
  - storage
  - recovery
boundary: A newly created Inception guest owns a first-boot Git checkout of the canonical Overalls repository.
denial: A malformed existing workspace is refused and an existing developer checkout is never overwritten.
scope: The guest bootstrap clones the canonical source, records the exact origin, and preserves a developer edit across stop/start. Control publication keeps an active DNS-01 proof ahead of optional gateway lookups during both initial issuance and renewal.
evidence:
  - assertion: self.assertEqual((target / "file.ex").read_text(), "developer edits")
    execution: present
    kind: unit
    path: nix/verification/tests/evaluation/inception-prepare.py
    scope: Isolated local Git origin; malformed paths, edit retention and origin validation are covered without external network access.
  - assertion: inception-probe verify 1 1
    execution: recorded
    kind: machine
    path: nix/verification/tests/machines/inception/driver.py
    record: docs/architecture/reviews/2026-10-22-inception-development-checkout.md
    record_assertion: The 2026-10-25 native create subtest passed for both workloads and checked the exact origin, checkout publication, writability and 16-vCPU/32-GiB/64-GiB shape.
    scope: Real Marshall/Lilly nested lifecycle records the `.git` directory, exact GitHub origin, writable development checkout and requested default shape. The later DNS-01 replica timeout prevented the restart/edit-retention phase from running.
gaps: Native source publication is recorded, but restart/edit retention and the remaining gateway/DNS-01 phases need a complete native run.
preferred_gap: Rerun the full nested Inception machine test to record developer-edit retention across stop/start and complete the gateway checks.
status: partial
